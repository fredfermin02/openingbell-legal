<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}Opening Bell</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111418;
        --muted: #5b6470;
        --rule: #e3e6ea;
        --accent: #0a8f4f;
        --code: #f3f5f7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0e11;
          --fg: #e8eaed;
          --muted: #9aa3ad;
          --rule: #252a31;
          --accent: #34c77b;
          --code: #171b20;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      header, main, footer { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }
      header { padding-top: 1.5rem; display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
      header .brand { font-weight: 700; letter-spacing: -0.01em; color: var(--fg); text-decoration: none; margin-right: auto; }
      header nav a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-size: 0.95rem; }
      header nav a:hover { color: var(--fg); }
      main { padding-top: 1rem; padding-bottom: 3rem; }
      h1 { font-size: 1.9rem; line-height: 1.2; letter-spacing: -0.02em; margin: 1.5rem 0 1rem; }
      h2 { font-size: 1.2rem; margin: 2.25rem 0 0.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
      p, ul { margin: 0 0 1rem; }
      li { margin-bottom: 0.35rem; }
      a { color: var(--accent); }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 0.93rem; margin: 0 0 1rem; }
      th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      footer { color: var(--muted); font-size: 0.85rem; padding-bottom: 2.5rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="{{ '/' | relative_url }}">Opening Bell</a>
      <nav>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
      </nav>
    </header>
    <main>
      {{ content | replace: '<table>', '<div class="table-wrap"><table>' | replace: '</table>', '</table></div>' }}
    </main>
    <footer>Opening Bell is not a brokerage and does not give investment advice.</footer>
  </body>
</html>
